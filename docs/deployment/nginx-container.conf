# docs.stationpc.com 容器内 nginx 反向代理配置（备选方案）
#
# 与 docker-compose.nginx.yml.example 配套使用：
#   cp docker-compose.nginx.yml.example docker-compose.yml
#   cp nginx-container.conf nginx.conf
#   docker compose up -d
#
# 证书由宿主机 certbot 签发后挂载给 nginx 容器（见 compose 文件 /etc/letsencrypt 挂载）。

# HTTP → HTTPS（同时承载 Let's Encrypt webroot 验证）
server {
    listen 80;
    server_name docs.stationpc.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name docs.stationpc.com;

    ssl_certificate     /etc/letsencrypt/live/docs.stationpc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.stationpc.com/privkey.pem;

    client_max_body_size 10m;

    # 静态资源长缓存：文件路径带内容 hash，可 immutable
    location /_next/static/ {
        proxy_pass http://app:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 其余请求经 Docker 内部网络转发到 app 服务
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
