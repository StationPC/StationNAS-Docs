# docs.stationpc.com 宿主机 nginx 反向代理配置（默认方案）
#
# 用法（服务器上）：
#   sudo cp nginx-host.example.conf /etc/nginx/sites-available/docs.stationpc.com
#   sudo ln -sf /etc/nginx/sites-available/docs.stationpc.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 说明：应用容器只监听 127.0.0.1:3000，不暴露公网；由本 nginx 终结 HTTPS 并反代。
# 证书由 certbot 签发，路径见下方 ssl_certificate。

# HTTP → HTTPS（同时承载 Let's Encrypt webroot 验证）
server {
    listen 80;
    server_name docs.stationpc.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name docs.stationpc.com;

    ssl_certificate     /etc/letsencrypt/live/docs.stationpc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.stationpc.com/privkey.pem;

    client_max_body_size 10m;

    # 静态资源长缓存：文件路径带内容 hash，可 immutable
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 其余请求透传给 Next.js standalone 容器
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
