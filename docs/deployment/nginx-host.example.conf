# docs.stationpc.com 宿主机 nginx 反向代理配置（默认方案）
#
# 用法（服务器上）：
#   sudo cp nginx-host.example.conf /etc/nginx/sites-available/docs.stationpc.com
#   sudo ln -sf /etc/nginx/sites-available/docs.stationpc.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 说明：应用容器只监听 127.0.0.1:3000，不暴露公网；由本 nginx 终结 HTTPS 并反代。
# 证书由 certbot 签发，路径见下方 ssl_certificate。
# gzip 建议配置在 /etc/nginx/nginx.conf 的 http{} 块，对全站生效（见 DEPLOYMENT.md）。

# ---------- HTTP: 仅用于 Let's Encrypt 验证与跳转 HTTPS ----------
server {
    listen 80;
    server_name docs.stationpc.com;

    # certbot webroot 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS: 反代 Next.js 容器 ----------
server {
    # 注：`http2` 写在这里（listen 参数）是 nginx < 1.25.1 的写法（如 Ubuntu 20.04 的 1.18.0）。
    # nginx >= 1.25.1 需改用 `listen 443 ssl;` + `http2 on;`（见 nginx-container.conf）。
    listen 443 ssl http2;
    server_name docs.stationpc.com;

    # 证书（certbot 签发，路径随域名）
    ssl_certificate     /etc/letsencrypt/live/docs.stationpc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.stationpc.com/privkey.pem;

    # --- SSL 最佳实践 ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;          # 现代客户端优先用 TLS1.3，无需服务器排序
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling：浏览器免去额外证书校验请求，加快 HTTPS
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;

    # HSTS：强制 HTTPS，半年有效期（含子域）。首次上线建议先去掉 includeSubDomains，
    # 确认子域都走 HTTPS 后再补，避免意外锁死
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 请求体限制（按需）
    client_max_body_size 10m;

    # 超时：Next.js 动态渲染/SSR 需要宽松的上游超时
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ---------- 静态资源：路径带内容 hash，长缓存 ----------
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------- 其余请求透传 Next.js 容器 ----------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_redirect off;
    }
}
