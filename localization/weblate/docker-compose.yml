services:
  cache:
    image: valkey/valkey:9.1.1
    command: [valkey-server, --save, '60', '1', --loglevel, warning]
    restart: always
    read_only: true
    volumes:
      - valkey-data:/data

  database:
    image: postgres:18-alpine
    env_file:
      - ./environment
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql

  weblate:
    image: weblate/weblate
    depends_on:
      - cache
      - database
    env_file:
      - ./environment
    ports:
      - 127.0.0.1:8080:8080
    read_only: true
    restart: always
    tmpfs:
      - /run
      - /tmp
    volumes:
      - weblate-cache:/app/cache
      - weblate-data:/app/data

volumes:
  postgres-data: {}
  valkey-data: {}
  weblate-cache: {}
  weblate-data: {}

