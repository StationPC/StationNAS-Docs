name: Render Weblate translations

on:
  pull_request:
    paths:
      - localization/xliff/*.xlf

permissions:
  contents: write

jobs:
  render:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'weblate/') || startsWith(github.head_ref, 'l10n/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run i18n:sync
      - run: npm run i18n:check:release
      - name: Commit generated documents
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "stationos-l10n-bot"
          git config user.email "stationos-l10n-bot@users.noreply.github.com"
          git add content/docs localization src/lib/locales.generated.ts
          git commit -m "docs: render reviewed translations"
          git push
