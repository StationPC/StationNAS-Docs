name: Deploy

# push main 自动部署（含合并 GitLocalize 翻译 PR）；workflow_dispatch 用于手动重发/应急
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/stationpc/stationnas-docs:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/stationpc/stationnas-docs:${{ github.sha }}
            ghcr.io/stationpc/stationnas-docs:latest
          # NEXT_PUBLIC_* 为构建时内联变量（仓库 variables）
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}

  deploy:
    name: Deploy to production server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: FEEDBACK_API_URL,FEEDBACK_API_TOKEN
        env:
          FEEDBACK_API_URL: ${{ secrets.FEEDBACK_API_URL }}
          FEEDBACK_API_TOKEN: ${{ secrets.FEEDBACK_API_TOKEN }}
        script: |
            set -e
            IMAGE=ghcr.io/stationpc/stationnas-docs:${{ github.sha }}
            docker pull "$IMAGE"
            docker rm -f stationnas-docs || true
            docker run -d --name stationnas-docs \
              --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              -e FEEDBACK_API_URL="$FEEDBACK_API_URL" \
              -e FEEDBACK_API_TOKEN="$FEEDBACK_API_TOKEN" \
              --label "deploy.sha=${{ github.sha }}" \
              "$IMAGE"
            # 清理旧镜像：保留最近 5 个 sha 镜像（latest 指向最新，不受影响），删除更旧的
            # 每次部署都会堆积一个带 <sha> tag 的镜像，长期不清理会占满磁盘
            docker image ls ghcr.io/stationpc/stationnas-docs \
              --format '{{.CreatedAt}}|{{.ID}}|{{.Tag}}' \
              | grep -v '|latest$' \
              | sort -r \
              | tail -n +6 \
              | cut -d'|' -f3 \
              | sed 's#^#ghcr.io/stationpc/stationnas-docs:#' \
              | xargs -r -n1 docker rmi || true
