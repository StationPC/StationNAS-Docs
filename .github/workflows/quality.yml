name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run i18n:test
      - run: npm run i18n:sync
      - name: Verify generated localization files are committed
        if: >-
          !startsWith(github.head_ref, 'weblate/') &&
          !startsWith(github.head_ref, 'l10n/')
        run: git diff --exit-code
      - run: npm run i18n:check
      - run: npm run types:check
      - run: npm run build
